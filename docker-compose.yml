# The default shape: the entire backend as ONE service, on one port.
#
#   docker compose up -d --build      API on http://localhost:3000
#
# Realx8-Ui is a separate repo and is not built here. Point it at this API with
# VITE_API_BASE_URL=http://localhost:3000/api, or run its own compose file which
# reverse-proxies /api here.
#
# For the per-service topology, use docker-compose.split.yml.

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-realto}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  core:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Unset SERVICES == every service in this one process.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-realto}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Every origin Realx8-Ui is served from. Without this the browser blocks
      # the API calls.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  mysql-data:
  uploads:
