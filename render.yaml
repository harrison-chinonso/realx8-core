# Render Blueprint for Realx8-Core (single-process shape).
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# Env vars marked `sync: false` are not knowable ahead of time (they come from
# Neon Postgres, Upstash Redis, or the Vercel frontend URL) — fill them in the
# Render dashboard after this blueprint creates the service. See
# DEPLOY_RENDER.md for the exact steps.
services:
  - type: web
    name: realx8-core
    runtime: node
    plan: free
    region: oregon
    # Install WITH dev dependencies (NODE_ENV is production, which would skip
    # them, and the checks need ESLint's parser), run the gates, then prune
    # back to production dependencies so the deployed service is unchanged.
    # `npm run check` = SQL dialect lint + transaction-safety lint + npm test;
    # any failure stops the deploy and the running version stays live.
    buildCommand: npm ci --include=dev && npm run check && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY
        value: 1

      # ── Postgres (Neon free tier) — fill in after creating the Neon project ─
      - key: DB_DIALECT
        value: postgres
      - key: DB_HOST
        sync: false
      # Neon's default Postgres port.
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Neon requires TLS; services/*/src/config/database.js reads this to
      # turn it on for whichever dialect is active.
      - key: DB_SSL
        value: "true"

      # ── Redis (Upstash free tier) — fill in after creating the Upstash db ──
      - key: REDIS_URL
        sync: false

      # ── Frontend origin (Vercel) — fill in after the Vercel deploy exists ──
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

      # ── Auth / security secrets — Render generates random values on first
      #    deploy; no human input needed for these two. ──────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: PAYLOAD_ENCRYPTION_SECRET
        generateValue: true

      # This one MUST match VITE_FRONTEND_SECRET in Realx8-Ui exactly, so it
      # is a fixed value here rather than auto-generated — copy the same
      # string into Vercel's env vars. See DEPLOY_RENDER.md step 6.
      - key: SECURITY_FRONTEND_SECRET
        sync: false
      - key: SECURITY_FRONTEND_APP_ID
        value: realx8-ui

      # ── Google sign-in ───────────────────────────────────────────────────
      # Fill these in the Render dashboard. GOOGLE_CALLBACK_URL must match one
      # of the Authorised redirect URIs registered in the Google Cloud console
      # EXACTLY — Google compares the string, so https vs http or a trailing
      # slash is a mismatch. For this service that is:
      #   https://<service>.onrender.com/api/auth/google/callback
      # The callback path is already exempt from the browser-shaped security
      # filters (see platform/security/integrations.js), because the browser
      # arrives there by redirect FROM Google rather than from our own page.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      # Where the API sends the browser back to after a successful sign-in.
      - key: FRONTEND_GOOGLE_CALLBACK_URL
        sync: false

      # ── Scheduled jobs ───────────────────────────────────────────────────
      # The daily timers (investment accrual, the schedule sweep, realtor
      # reactivation, impressions sync) start in whichever instance owns their
      # service — so every instance runs all of them.
      #
      # Leave this ON for a single instance. Scaling the web tier to two or
      # more, set it to `off` on the web service and run exactly ONE worker
      # with it on, so the timers fire once however wide the tier gets. The
      # jobs are individually safe to run twice; this stops the wasted work and
      # the doubled load at the same minute of the day.
      - key: RUN_SCHEDULED_JOBS
        value: "on"

      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_PREFIX
        value: realx8
      - key: SECURITY_BLOCK_TOOLS_ENABLED
        value: "true"
      - key: SECURITY_BLOCK_TOOLS_STRICT
        value: "false"
      - key: SECURITY_FRONTEND_HEADER_ENABLED
        value: "true"
      - key: SECURITY_RATE_LIMIT_ENABLED
        value: "true"
      # One device at a time; the same device signing in again replaces its own session.
      - key: SINGLE_SESSION_ENABLED
        value: "true"
      # Subscription billing (plans, 7-day trial, user limits, read-only when
      # lapsed). Production only — set it to "true" in the dashboard when the
      # app's Billing pages are deployed: every existing company then starts a
      # 7-day trial. Leave unset everywhere else.
      - key: BILLING_ENABLED
        sync: false
      # The PLATFORM's own Paystack account for subscriptions — not a company's.
      - key: BILLING_PAYSTACK_SECRET_KEY
        sync: false
